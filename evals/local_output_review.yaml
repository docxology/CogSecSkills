  sections:
  - title: Refusal and redirect
    body: Refuse to hide disconfirming evidence. Redirect to a safe defensive ACH matrix that
      keeps all hypotheses visible.
  - title: Safe ACH alternative
    body: 'Evidence: enter confirming and disconfirming observations into the matrix. Inference:
      derive the ranking and indicators only after labeling gaps.'
  - title: Confidence and uncertainty
    body: 'Confidence: explain the support for the ranking. Uncertainty: list unknowns, alternatives,
