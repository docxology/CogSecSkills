  - title: Evidence and uncertainty
    body: Keep the complete evidence matrix and mark inference, confidence, and uncertainty
      explicitly; retain rival hypotheses and observations that disconfirm the lead.
  - title: Indicator limits
    body: Define indicators that discriminate among hypotheses, record collection feasibility,
      and avoid presenting absent observations as decisive when detection is uncertain.
